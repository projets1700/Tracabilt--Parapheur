server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy toutes les requêtes /api vers le backend
    location /api {
        # Import de documents (la limite fonctionnelle est vérifiée par l'API)
        client_max_body_size 500m;
        # Conversions / générations documentaires pouvant durer plusieurs dizaines de secondes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Modules JavaScript .mjs (moteur d'affichage PDF pdf.js) : nginx ne connaît pas
    # cette extension et les servirait en application/octet-stream, ce que les
    # navigateurs refusent pour un module.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        try_files $uri =404;
    }

    # React Router : renvoie index.html pour toutes les routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}